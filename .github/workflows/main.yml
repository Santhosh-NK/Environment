name: Deploy App Service

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: Self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4


    - name: Deploy App Service
      run: |
        az deployment group create --resource-group apim-rg --template-file "app_service.bicep" --parameters app_service.json